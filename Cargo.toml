[package]
name = "hrx-rs"
version = "0.8.8"
edition = "2024"
rust-version = "1.91"
license = "MIT AND Apache-2.0 AND (Apache-2.0 WITH LLVM-exception)"
description = "Owned native AMD GPU and NPU execution with Loom compilation"
repository = "https://github.com/zacharydenton/hrx-rs"
readme = "README.md"
keywords = ["gpu", "npu", "amdgpu", "compute", "loom"]
categories = ["hardware-support", "science"]
include = [
    "/src/**",
    "/docs/GPU-NPU.md",
    "/tests/**",
    "/examples/**",
    "/native/**",
    "/patches/**",
    "/scripts/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/bundle.json",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/THIRD-PARTY.md",
    "/THIRD-PARTY.json",
    "!**/__pycache__/**",
    "!**/*.pyc",
    "!/scripts/vision-bench/**",
    "!/scripts/contention.py",
    "!/scripts/build-compiler-variants.py",
    "!/patches/retired/**",
]

# docs.rs has no GPU and no native bundle. Nothing here initializes either at
# build time, so documenting every feature is safe.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "hrx"

[features]
# Native XDNA execution and tracked cross-device scheduling.
npu = []

[dependencies]
thiserror = "2"
libloading = "0.8"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
ureq = "3"
hf-hub = { version = "1.0", default-features = false, features = ["blocking", "rustls-tls"] }
onnx-protobuf = "0.2.3"
# onnx-protobuf 0.2.3 generated bindings require this runtime version.
protobuf = "=3.4.0"
safetensors = "0.8"
memmap2 = "0.9"

[[example]]
name = "unified_probe"
required-features = ["npu"]

[[example]]
name = "shared_roundtrip"
required-features = ["npu"]

[[example]]
name = "shared_bench"
required-features = ["npu"]

[[example]]
name = "mall_probe"
required-features = ["npu"]

[[bin]]
name = "hrx"
path = "src/bin/hrx.rs"

[lints.clippy]
large_stack_arrays = "warn"
match_wildcard_for_single_variants = "warn"

[lints.rust]
missing_docs = "warn"

[[example]]
name = "compile_npu"
required-features = ["npu"]

[[test]]
name = "heterogeneous"
required-features = ["npu"]

[[example]]
name = "gemm_pipeline"
required-features = ["npu"]

[[example]]
name = "gpu_npu_parallel"
required-features = ["npu"]
