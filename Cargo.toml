[package]
name = "hrx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
# Native release availability and inherited dependency provenance are unresolved.
publish = false
description = "Owned GPU execution, Loom compilation, and portable model ABI support for HRX"
repository = "https://github.com/zacharydenton/hrx.rs"
readme = "README.md"
keywords = ["gpu", "amdgpu", "compute", "loom"]
categories = ["hardware-support", "science"]
include = ["src/**", "tests/**", "examples/**", "native/**", "patches/**", "scripts/**", "Cargo.toml", "Cargo.lock", "bundle.json", "README.md", "CHANGELOG.md", "LICENSE", "THIRD-PARTY.md", "VALIDATION.md"]

[features]
default = ["download", "loom", "ffi"]
download = ["dep:ureq"]
loom = []
ffi = []
runner = ["loom"]
compat = ["dep:bytemuck"]

[dependencies]
thiserror = "2"
libloading = "0.8"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
ureq = { version = "3", optional = true }
bytemuck = { version = "1", optional = true }

[[bin]]
name = "hrx"
path = "src/bin/hrx.rs"
required-features = ["runner"]

[[bin]]
name = "loomrun"
path = "src/bin/loomrun.rs"
required-features = ["runner"]

[lints.clippy]
large_stack_arrays = "warn"
match_wildcard_for_single_variants = "warn"

[lints.rust]
missing_docs = "warn"
