[package]
name = "hrx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Owned GPU execution, Loom compilation, and portable model ABI support for HRX"
exclude = ["artifacts", "target"]

[features]
default = ["download", "loom", "ffi"]
download = ["dep:ureq"]
loom = []
ffi = []
runner = ["loom"]
compat = ["dep:bytemuck"]

[dependencies]
libloading = "0.8"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
ureq = { version = "3", optional = true }
bytemuck = { version = "1", optional = true }

[[bin]]
name = "hrx"
path = "src/bin/hrx.rs"
required-features = ["runner"]

[[bin]]
name = "loomrun"
path = "src/bin/loomrun.rs"
required-features = ["runner"]
