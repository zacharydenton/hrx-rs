[package]
name = "hrx-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT AND Apache-2.0 AND (Apache-2.0 WITH LLVM-exception)"
description = "Owned GPU and NPU execution with Loom and IRON compilation"
repository = "https://github.com/zacharydenton/hrx-rs"
readme = "README.md"
keywords = ["gpu", "npu", "amdgpu", "compute", "loom"]
categories = ["hardware-support", "science"]
include = ["/src/**", "/docs/**", "/tests/**", "/examples/**", "/native/**", "/patches/**", "/scripts/**", "/Cargo.toml", "/Cargo.lock", "/bundle.json", "/npu-bundle.json", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/THIRD-PARTY.md", "/THIRD-PARTY.json", "/VALIDATION.md"]

# docs.rs has no GPU and no native bundle. Nothing here initializes either at
# build time, so documenting every feature is safe.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "hrx"

[features]
default = ["download", "loom"]
download = ["dep:ureq"]
loom = []
runner = ["loom"]
# Low-level cross-device probes; XRT is loaded only at runtime.
npu-probe = ["npu"]
# The shared-memory NPU API.
npu = []
# Compile IRON/AIE projects in a pinned external toolchain.
npu-compile = ["npu"]

[dependencies]
thiserror = "2"
libloading = "0.8"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"
ureq = { version = "3", optional = true }

[[example]]
name = "unified_probe"
required-features = ["npu-probe"]

[[example]]
name = "dmabuf_probe"
required-features = ["npu-probe"]

[[example]]
name = "shared_roundtrip"
required-features = ["npu"]

[[example]]
name = "shared_bench"
required-features = ["npu"]

[[example]]
name = "mall_probe"
required-features = ["npu"]

[[bin]]
name = "hrx"
path = "src/bin/hrx.rs"
required-features = ["runner"]

[lints.clippy]
large_stack_arrays = "warn"
match_wildcard_for_single_variants = "warn"

[lints.rust]
missing_docs = "warn"

[[example]]
name = "stream_bench"
required-features = ["loom"]

[[test]]
name = "gpu"
required-features = ["loom"]

[[test]]
name = "embedding"
required-features = ["loom"]

[[example]]
name = "compile_npu"
required-features = ["npu-compile"]

[[test]]
name = "heterogeneous"
required-features = ["npu", "loom"]

[[example]]
name = "gemm_pipeline"
required-features = ["npu", "loom"]
