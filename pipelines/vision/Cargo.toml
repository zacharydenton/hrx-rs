[package]
name = "hrx-vision"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Resident DINO, SCRFD and ArcFace composition using HRX"

[dependencies]
anyhow = "1"
hrx = { package = "hrx-rs", path = "../.." }
dinov3-hrx = { path = "../../../dinov3-hrx" }
scrfd-hrx = { path = "../../../scrfd-hrx" }
arcface-hrx = { path = "../../../arcface-hrx" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[patch.crates-io]
hrx-rs = { path = "../.." }
